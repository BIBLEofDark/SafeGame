<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雨夜长江航道趸船 - 三渲二微缩景观</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090d16;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
  </style>
  <!-- Three.js Core & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<script>
window.onload = function () {
  // ============================================================================
  // 1. 场景、相机与渲染器初始化（无任何UI，纯正微缩模型展示）
  // ============================================================================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a101d);
  scene.fog = new THREE.FogExp2(0x0a101d, 0.0085);

  const camera = new THREE.PerspectiveCamera(
    36,
    window.innerWidth / window.innerHeight,
    0.5,
    300
  );

  // 初始俯视 30° 视角（仰角 30°，距离适中，兼顾引桥与二楼宿舍四个房间内景）
  const dist = 44;
  const pitchRad = THREE.MathUtils.degToRad(30); // 俯视 30°
  const yawRad = THREE.MathUtils.degToRad(16);   // 微偏右侧，展现立体层次又看清二楼正面窗户
  camera.position.set(
    Math.sin(yawRad) * Math.cos(pitchRad) * dist,
    Math.sin(pitchRad) * dist + 2.5,
    Math.cos(yawRad) * Math.cos(pitchRad) * dist
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 3.3, 1.5);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 12;
  controls.maxDistance = 85;
  controls.maxPolarAngle = Math.PI / 2 - 0.04; // 禁止穿入水面以下
  controls.minPolarAngle = 0.12;
  controls.update();

  // ============================================================================
  // 2. 三渲二（Cel-Shading）核心材质与卡通描边工具
  // ============================================================================
  // 创建 4 阶卡通色阶贴图
  function createToonGradientMap() {
    const data = new Uint8Array([
      65, 72, 95, 255,
      125, 135, 160, 255,
      195, 202, 218, 255,
      250, 252, 255, 255
    ]);
    const texture = new THREE.DataTexture(data, 4, 1, THREE.RGBAFormat);
    texture.minFilter = THREE.NearestFilter;
    texture.magFilter = THREE.NearestFilter;
    texture.needsUpdate = true;
    return texture;
  }
  const toonGradient = createToonGradientMap();

  // 创建卡通材质辅助函数
  function makeToonMat(color, opts = {}) {
    return new THREE.MeshToonMaterial({
      color: color,
      gradientMap: toonGradient,
      transparent: opts.transparent || false,
      opacity: opts.opacity !== undefined ? opts.opacity : 1.0,
      emissive: opts.emissive !== undefined ? new THREE.Color(opts.emissive) : new THREE.Color(0x000000),
      emissiveIntensity: opts.emissiveIntensity !== undefined ? opts.emissiveIntensity : 0.0,
      map: opts.map || null,
      side: opts.side || THREE.FrontSide
    });
  }

  // 卡通硬边轮廓线材质
  const outlineLineMat = new THREE.LineBasicMaterial({
    color: 0x111726,
    transparent: true,
    opacity: 0.72
  });

  const warmOutlineLineMat = new THREE.LineBasicMaterial({
    color: 0x3a2418,
    transparent: true,
    opacity: 0.65
  });

  // 为几何体添加三渲二轮廓线
  function addOutline(mesh, threshold = 22, isWarm = false) {
    if (!mesh.geometry) return mesh;
    const edges = new THREE.EdgesGeometry(mesh.geometry, threshold);
    const line = new THREE.LineSegments(edges, isWarm ? warmOutlineLineMat : outlineLineMat);
    mesh.add(line);
    return mesh;
  }

  // 针对圆润物体（如人物头部/躯干/救生圈）添加法线外扩描边
  const hullOutlineMat = new THREE.MeshBasicMaterial({
    color: 0x131926,
    side: THREE.BackSide
  });
  function addHullOutline(mesh, scaleFactor = 1.06) {
    const outlineMesh = new THREE.Mesh(mesh.geometry, hullOutlineMat);
    outlineMesh.scale.setScalar(scaleFactor);
    mesh.add(outlineMesh);
    return mesh;
  }

  // 快速创建带描边的 Box
  function createToonBox(w, h, d, mat, outlineThreshold = 20, isWarm = false, castShadow = true) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = castShadow;
    mesh.receiveShadow = true;
    addOutline(mesh, outlineThreshold, isWarm);
    return mesh;
  }

  // ============================================================================
  // 3. 程序化纹理生成（标牌、徽标、防滑绿地面、黄黑警示带、海报等）
  // ============================================================================
  // 3.1 黄黑警示斜纹贴图
  function createHazardTexture(repeatX = 16) {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#eab308';
    ctx.fillRect(0, 0, 256, 64);
    ctx.fillStyle = '#171923';
    for (let i = -64; i < 320; i += 32) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i + 16, 0);
      ctx.lineTo(i - 16, 64);
      ctx.lineTo(i - 32, 64);
      ctx.closePath();
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(repeatX, 1);
    return tex;
  }

  // 3.2 引桥绿色防滑波纹铺面贴图
  function createGreenGangwayTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#256f5c';
    ctx.fillRect(0, 0, 512, 512);

    // 颗粒质感
    for (let i = 0; i < 4500; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.09)';
      ctx.fillRect(Math.random() * 512, Math.random() * 512, 3, 3);
    }

    // 折线形防滑凸起纹理（还原参考图引桥特征）
    ctx.strokeStyle = '#194f40';
    ctx.lineWidth = 6;
    for (let y = 24; y < 512; y += 32) {
      ctx.beginPath();
      ctx.moveTo(20, y);
      ctx.lineTo(130, y);
      ctx.lineTo(175, y - 10);
      ctx.lineTo(256, y);
      ctx.lineTo(337, y - 10);
      ctx.lineTo(382, y);
      ctx.lineTo(492, y);
      ctx.stroke();

      ctx.strokeStyle = '#36937b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(20, y - 3);
      ctx.lineTo(130, y - 3);
      ctx.lineTo(175, y - 13);
      ctx.lineTo(256, y - 3);
      ctx.lineTo(337, y - 13);
      ctx.lineTo(382, y - 3);
      ctx.lineTo(492, y - 3);
      ctx.stroke();
      ctx.strokeStyle = '#194f40';
      ctx.lineWidth = 6;
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  // 3.3 屋顶单个立体汉字贴图（“長”、“江”、“航”、“道”）
  function createCalligraphyCharTexture(char) {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 256, 256);

    ctx.font = '900 180px "Kaiti", "STKaiti", "KaiTi", "Microsoft YaHei", serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 白色外发光描边
    ctx.lineWidth = 18;
    ctx.strokeStyle = '#e2f1ff';
    ctx.strokeText(char, 128, 134);

    // 深海蓝内芯
    ctx.fillStyle = '#123e75';
    ctx.fillText(char, 128, 134);

    return new THREE.CanvasTexture(canvas);
  }

  // 3.4 船顶中央“长江航道”圆形徽标贴图
  function createWaterwayLogoTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    // 外圈白底与蓝环
    ctx.beginPath();
    ctx.arc(256, 256, 240, 0, Math.PI * 2);
    ctx.fillStyle = '#f0f7ff';
    ctx.fill();
    ctx.lineWidth = 16;
    ctx.strokeStyle = '#164e87';
    ctx.stroke();

    // 内圈蓝色圆心
    ctx.beginPath();
    ctx.arc(256, 256, 175, 0, Math.PI * 2);
    ctx.fillStyle = '#164e87';
    ctx.fill();

    // 航标灯塔与江水透视弧线（还原参考图徽标图案）
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(130, 330);
    ctx.quadraticCurveTo(256, 240, 382, 330);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(155, 370);
    ctx.quadraticCurveTo(256, 290, 357, 370);
    ctx.stroke();

    // 灯塔光柱
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(246, 275);
    ctx.lineTo(266, 275);
    ctx.lineTo(260, 145);
    ctx.lineTo(252, 145);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(256, 132, 14, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd166';
    ctx.fill();

    // 顶部文字示意
    ctx.fillStyle = '#164e87';
    ctx.font = 'bold 34px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('长 江 航 道', 256, 56);
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('CHANGJIANG WATERWAY', 256, 462);

    return new THREE.CanvasTexture(canvas);
  }

  // 3.5 标牌贴图生成（如“武道趸30402”及安全警示牌）
  function createSignTexture(text, bgColor, textColor, borderColor, width = 256, height = 96) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, width, height);

    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 8;
    ctx.strokeRect(6, 6, width - 12, height - 12);

    ctx.fillStyle = textColor;
    ctx.font = `bold ${Math.floor(height * 0.46)}px "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, width / 2, height / 2 + 2);

    return new THREE.CanvasTexture(canvas);
  }

  // ============================================================================
  // 4. 灯光系统（雨夜冷色环境光 + 室内与射灯温暖琥珀色光影对比）
  // ============================================================================
  // 冷色雨夜天光
  const hemiLight = new THREE.HemisphereLight(0x283e66, 0x0b1322, 0.72);
  scene.add(hemiLight);

  // 月光/夜空冷调方向光（产生清晰的微缩模型阴影）
  const dirLight = new THREE.DirectionalLight(0x4f74a8, 0.58);
  dirLight.position.set(-18, 28, 22);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 2048;
  dirLight.shadow.mapSize.height = 2048;
  dirLight.shadow.camera.near = 5;
  dirLight.shadow.camera.far = 80;
  const dCam = 22;
  dirLight.shadow.camera.left = -dCam;
  dirLight.shadow.camera.right = dCam;
  dirLight.shadow.camera.top = dCam;
  dirLight.shadow.camera.bottom = -dCam;
  dirLight.shadow.bias = -0.0005;
  scene.add(dirLight);

  // ============================================================================
  // 5. 微缩景观底座与动态水面（带波浪、雨滴涟漪与二楼暖光湿润倒影）
  // ============================================================================
  const dioramaGroup = new THREE.Group();
  scene.add(dioramaGroup);

  const waterWidth = 40;
  const waterDepth = 30;

  // 微缩模型精致暗色收藏底座边框
  const baseFrameGroup = new THREE.Group();
  const basePlateMat = makeToonMat(0x0d1522);
  const basePlate = new THREE.Mesh(new THREE.BoxGeometry(waterWidth + 0.6, 1.3, waterDepth + 0.6), basePlateMat);
  basePlate.position.set(0, -1.15, 2.5);
  addOutline(basePlate, 25);
  baseFrameGroup.add(basePlate);

  // 底座金铜色细装饰线（体现可收藏微缩模型质感）
  const brassTrimMat = new THREE.MeshBasicMaterial({ color: 0x7c6238 });
  const brassTrim = new THREE.Mesh(new THREE.BoxGeometry(waterWidth + 0.72, 0.08, waterDepth + 0.72), brassTrimMat);
  brassTrim.position.set(0, -0.58, 2.5);
  baseFrameGroup.add(brassTrim);
  dioramaGroup.add(baseFrameGroup);

  // 三渲二雨夜江水 Shader（结合波浪、暖色窗户倒影、射灯倒影与动态雨滴涟漪圈）
  const waterGeo = new THREE.PlaneGeometry(waterWidth, waterDepth, 120, 90);
  waterGeo.rotateX(-Math.PI / 2);

  const waterUniforms = {
    uTime: { value: 0 },
    uFlicker: { value: 1.0 }
  };

  const waterShaderMat = new THREE.ShaderMaterial({
    uniforms: waterUniforms,
    transparent: true,
    vertexShader: `
      uniform float uTime;
      varying vec3 vWorldPos;
      varying vec2 vUv;
      varying float vWaveHeight;

      void main() {
        vUv = uv;
        vec3 pos = position;
        float w1 = sin(pos.x * 0.55 + uTime * 1.8) * cos(pos.z * 0.45 + uTime * 1.4) * 0.12;
        float w2 = sin(pos.x * 1.3 - uTime * 2.4 + pos.z * 0.9) * 0.05;
        pos.y += w1 + w2;
        vWaveHeight = w1 + w2;
        vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
        vWorldPos = worldPosition.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPosition;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uFlicker;
      varying vec3 vWorldPos;
      varying vec2 vUv;
      varying float vWaveHeight;

      // 伪随机哈希
      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      // 动态雨滴涟漪环
      float rainRipple(vec2 uv, float scale, float timeOffset) {
        vec2 st = uv * scale;
        vec2 id = floor(st);
        vec2 f = fract(st) - 0.5;
        float h = hash(id);
        float t = fract(uTime * 0.85 + h * 6.28 + timeOffset);
        float radius = t * 0.45;
        float ring = smoothstep(0.05, 0.0, abs(length(f) - radius)) * (1.0 - t);
        return ring * step(0.55, h);
      }

      void main() {
        // 基础三渲二深青蓝江水色阶
        vec3 deepColor = vec3(0.05, 0.11, 0.19);
        vec3 midColor  = vec3(0.08, 0.18, 0.28);
        vec3 crestColor = vec3(0.16, 0.30, 0.43);

        float waveStep = smoothstep(-0.08, 0.08, vWaveHeight);
        vec3 waterCol = mix(deepColor, midColor, step(0.35, waveStep));
        waterCol = mix(waterCol, crestColor, step(0.76, waveStep));

        // 波纹扰动坐标
        float rippleDistort = sin(vWorldPos.z * 3.5 + uTime * 4.2) * 0.35
                            + cos(vWorldPos.x * 2.8 - uTime * 3.1) * 0.25;

        // 二楼四个温暖宿舍窗户在水面上的昏黄倒影
        float zFrontDist = vWorldPos.z - 4.2;
        if (zFrontDist > 0.0 && zFrontDist < 12.0) {
          float fadeZ = 1.0 - smoothstep(0.0, 11.5, zFrontDist);
          float wx = vWorldPos.x + rippleDistort * 0.55;
          // 四个房间窗口中心 x: -6.3, -2.1, 2.1, 6.3
          float r1 = exp(-pow((wx + 6.3) * 0.65, 2.0));
          float r2 = exp(-pow((wx + 2.1) * 0.65, 2.0));
          float r3 = exp(-pow((wx - 2.1) * 0.65, 2.0));
          float r4 = exp(-pow((wx - 6.3) * 0.65, 2.0));
          float windowGlow = (r1 + r2 + r3 + r4) * fadeZ;
          // 卡通阶梯化反光条纹
          float stripeMask = step(0.42, sin(vWorldPos.z * 5.0 - uTime * 5.5) * 0.5 + 0.5);
          vec3 warmReflect = vec3(1.0, 0.66, 0.24) * (windowGlow * 0.65 + windowGlow * stripeMask * 0.55);
          waterCol += warmReflect;
        }

        // 左右舷边射灯在水面的光斑倒影（右侧受闪烁控制）
        float leftSpot = exp(-length(vWorldPos.xz - vec2(-13.2 + rippleDistort * 0.3, 2.0)) * 0.28);
        float rightSpot = exp(-length(vWorldPos.xz - vec2(13.2 + rippleDistort * 0.3, 2.0)) * 0.28) * uFlicker;
        waterCol += vec3(1.0, 0.72, 0.30) * (leftSpot + rightSpot) * 0.55;

        // 船体周围环境暗角闭塞
        float hullMask = smoothstep(0.0, 2.2, max(abs(vWorldPos.x) - 14.2, abs(vWorldPos.z + 0.5) - 5.2));
        waterCol *= mix(0.45, 1.0, hullMask);

        // 雨滴打在水面上的二次元白色涟漪圈
        float ripples = rainRipple(vUv, 14.0, 0.0) + rainRipple(vUv, 22.0, 1.7);
        waterCol = mix(waterCol, vec3(0.55, 0.75, 0.92), clamp(ripples * 0.75, 0.0, 1.0));

        // 边缘柔和过渡
        gl_FragColor = vec4(waterCol, 0.96);
      }
    `
  });

  const waterMesh = new THREE.Mesh(waterGeo, waterShaderMat);
  waterMesh.position.set(0, -0.45, 2.5);
  dioramaGroup.add(waterMesh);

  // ============================================================================
  // 6. 趸船主体结构（严格还原参考图：平底钢壳、三层建筑、前伸引桥、船顶大字）
  // ============================================================================
  const boatGroup = new THREE.Group();
  dioramaGroup.add(boatGroup);

  // 常用材质定义
  const matHullDark = makeToonMat(0x212936);
  const matHullBlack = makeToonMat(0x141922);
  const matDeckGrey = makeToonMat(0x465362);
  const matDeckWet = makeToonMat(0x364354);
  const matCabinWhite = makeToonMat(0xdce5f0);
  const matNavBlue = makeToonMat(0x164a84);
  const matRoofBlue = makeToonMat(0x2563a6);
  const matFrameSilver = makeToonMat(0x94a3b8);
  const matSteelGrey = makeToonMat(0x64748b);
  const matRailingWhite = makeToonMat(0xe2e8f0);
  const matTarpGreen = makeToonMat(0x3f4f44);
  const matLifeRingOrange = makeToonMat(0xea580c);
  const matFireRed = makeToonMat(0xdc2626);
  const matFlagRed = makeToonMat(0xef4444, { side: THREE.DoubleSide });
  const matHazard = makeToonMat(0xffffff, { map: createHazardTexture(18) });

  // ----------------------------------------------------------------------------
  // 6.1 趸船钢制底壳（Hull）与防撞护舷
  // ----------------------------------------------------------------------------
  const hullGroup = new THREE.Group();
  boatGroup.add(hullGroup);

  // 主船体钢壳 (长 28, 高 1.3, 宽 10)
  const mainHull = createToonBox(28.0, 1.3, 10.0, matHullDark, 20);
  mainHull.position.set(0, 0.0, -0.5);
  hullGroup.add(mainHull);

  // 船壳水线黑边
  const waterlineBelt = createToonBox(28.15, 0.38, 10.15, matHullBlack, 20);
  waterlineBelt.position.set(0, -0.35, -0.5);
  hullGroup.add(waterlineBelt);

  // 一层主甲板面
  const mainDeck = createToonBox(28.3, 0.18, 10.3, matDeckWet, 20);
  mainDeck.position.set(0, 0.68, -0.5);
  hullGroup.add(mainDeck);

  // 船壳四周竖向防撞钢肋与防撞轮胎（还原参考图船体黑灰竖肋细节）
  for (let x = -13.2; x <= 13.2; x += 1.65) {
    const ribF = createToonBox(0.22, 1.15, 0.25, matHullBlack, 20);
    ribF.position.set(x, 0.05, 4.58);
    hullGroup.add(ribF);

    const ribB = createToonBox(0.22, 1.15, 0.25, matHullBlack, 20);
    ribB.position.set(x, 0.05, -5.58);
    hullGroup.add(ribB);
  }

  // 船壳正前方黄黑警示边缘条
  const hullHazardFront = createToonBox(28.32, 0.2, 0.15, matHazard, 20);
  hullHazardFront.position.set(0, 0.65, 4.62);
  hullGroup.add(hullHazardFront);

  // ----------------------------------------------------------------------------
  // 6.2 一层舱室（1st Floor Cabin）
  // ----------------------------------------------------------------------------
  const floor1Group = new THREE.Group();
  floor1Group.position.set(0, 0.77, -0.5);
  boatGroup.add(floor1Group);

  // 一层主舱体（左右留出宽敞的锚机甲板，长 18.8，高 2.5，深 6.6）
  const f1CabinW = 18.8;
  const f1CabinH = 2.5;
  const f1CabinD = 6.6;

  const f1Body = createToonBox(f1CabinW, f1CabinH, f1CabinD, matCabinWhite, 20);
  f1Body.position.set(0, f1CabinH / 2, 0);

    const headGeo = new THREE.SphereGeometry(0.19, 16, 14);
    const head = new THREE.Mesh(headGeo, matSkin);
    addHullOutline(head, 1.07);
    headGroup.add(head);

    // 头发（二次元块状造型）

      new THREE.SphereGeometry(0.205, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.62),
      matHair
    );
    hairCap.position.y = 0.02;
    hairCap.rotation.x = -0.15;
    headGroup.add(hairCap);

    // 眼睛（简洁二次元神态）

    rightEye.position.set(0.065, 0.0, 0.175);
    headGroup.add(leftEye, rightEye);

    // 左右手臂（铰接在肩部）
    const leftArmPivot = new THREE.Group();
    leftArmPivot.position.set(-0.26, 0.46, 0);
    const leftArm = createToonBox(0.12, 0.42, 0.12, matShirt, 20, true);
    leftArm.position.set(0, -0.18, 0);

    leftHand.position.set(0, -0.4, 0);
    leftArmPivot.add(leftArm, leftHand);
    charGroup.add(leftArmPivot);

    const rightArmPivot = new THREE.Group();
    rightArmPivot.position.set(0.26, 0.46, 0);
    const rightArm = createToonBox(0.12, 0.42, 0.12, matShirt, 20, true);
    rightArm.position.set(0, -0.18, 0);
    const rightHand = new THREE.Mesh(new THREE.SphereGeometry(0.065, 10, 10), matSkin);
    rightHand.position.set(0, -0.4, 0);
    rightArmPivot.add(rightArm, rightHand);
    charGroup.add(rightArmPivot);

    // 腿部
    if (isSitting) {
      const thighL = createToonBox(0.15, 0.15, 0.38, matPants, 20, true);
      thighL.position.set(-0.11, 0.05, 0.16);
      const calfL = createToonBox(0.13, 0.36, 0.13, matPants, 20, true);
      calfL.position.set(-0.11, -0.16, 0.32);

      const thighR = createToonBox(0.15, 0.15, 0.38, matPants, 20, true);

      calfR.position.set(0.11, -0.16, 0.32);

      legR.position.set(0.11, -0.25, 0);
      charGroup.add(legL, legR);
    }

    return {
      root: charGroup,
      torso,
      headGroup,
      leftArmPivot,
      rightArmPivot,
      leftHand,
      rightHand

  // 创建带救生圈的白色铁艺护栏函数
  function buildDeckRailing(parent, yBase, width, depth, hasDiamondPattern = true, gapFrontCenter = 0) {
    const rHeight = 0.85;
    const halfW = width / 2;
    const halfD = depth / 2;

    // 顶部与中部横杆函数
    function addRailSegment(x1, z1, x2, z2) {
      const dx = x2 - x1;
      const dz = z2 - z1;
      const len = Math.hypot(dx, dz);
      const cx = (x1 + x2) / 2;
      const cz = (z1 + z2) / 2;
      const angle = Math.atan2(dx, dz);

      const segGroup = new THREE.Group();
      segGroup.position.set(cx, yBase, cz);
      segGroup.rotation.y = angle;
      parent.add(segGroup);

    const slope = Math.tan(0.45);            // 坡角正切 ≈ 0.483
    const totalDx = -slope * height;         // 水平位移（向内/向左）
    const railLen = (height / Math.cos(0.45)) * 1.04; // 斜向栏杆实际长度

    // 左右扶手栏杆（rotation.z = +0.45 → 向左上方延伸）

      const rail = createToonBox(0.06, railLen, 0.10, matHullDark, 20);
      rail.position.set(totalDx / 2, height / 2, dz);
      rail.rotation.z = 0.45;               // 修正：正角度使栏杆向内倾斜
      stairGroup.add(rail);
    });

    // 踏板严格沿坡面均匀分布
    for (let s = 1; s <= 7; s++) {
      const t = s / 8;
      const step = createToonBox(0.32, 0.05, 0.62, matSteelGrey, 20);
      step.position.set(totalDx * t, t * height, 0);
      stairGroup.add(step);

    return new THREE.CanvasTexture(canvas);
  }

    [8.0, 3.25, 3.6, 0.82]
  ];

  dripEmitPoints.forEach(([dx, startY, dz, targetY], idx) => {
    const dropMesh = new THREE.Mesh(new THREE.ConeGeometry(0.032, 0.16, 6), dripMat);
    dropMesh.position.set(dx, startY, dz);
    boatGroup.add(dropMesh);

    const splashRing = new THREE.Mesh(
      new THREE.RingGeometry(0.04, 0.08, 16),
      splashMat.clone()
    );
    splashRing.rotation.x = -Math.PI / 2;
    splashRing.position.set(dx, targetY + 0.02, dz);
    boatGroup.add(splashRing);

    eavesDrips.push({
      dropMesh,
      splashRing,
      startY,
      targetY,
      progress: (idx * 0.23) % 1.0,
      speed: 0.65 + (idx % 3) * 0.15
    });
  });

  // ============================================================================
  // 14. 动画主循环（驱动所有雨夜动态与船员日常动作）
  // ============================================================================
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), 0.05);
    const elapsed = clock.getElapsedTime();

    controls.update();

    // 1. 水面波浪与雨滴涟漪 Shader 更新
    waterUniforms.uTime.value = elapsed;

    // 2. 趸船随江浪极其轻微、治愈的上下起伏与摇摆
    boatGroup.position.y = Math.sin(elapsed * 1.35) * 0.045;
    boatGroup.rotation.z = Math.sin(elapsed * 0.95) * 0.0045;
    boatGroup.rotation.x = Math.cos(elapsed * 1.15) * 0.0035;

    // 3. 损坏的右舷射灯轻微接触不良闪烁
    let flickerFactor = 1.0;
    const cycle = elapsed % 5.5;
    if (
      (cycle > 1.2 && cycle < 1.28) ||
      (cycle > 1.35 && cycle < 1.48) ||
      (cycle > 3.8 && cycle < 3.86)
    ) {
      flickerFactor = 0.12 + Math.random() * 0.25;
    } else if (cycle > 1.48 && cycle < 1.7) {
      flickerFactor = 0.65 + Math.sin(elapsed * 45) * 0.25;
    }

    if (flickeringSpotlight) {
      flickeringSpotlight.pLight.intensity = 1.35 * flickerFactor;
      flickeringSpotlight.coneMat.opacity = 0.85 * flickerFactor;
      flickeringSpotlight.bulbMat.color.setHex(flickerFactor > 0.5 ? 0xffe082 : 0x5c4822);
    }
    waterUniforms.uFlicker.value = flickerFactor;

    // 4. 射灯周围飞虫/飞蛾盘旋轨迹
    mothSwarms.forEach((swarm) => {
      swarm.insects.forEach((bug) => {
        const angle = elapsed * bug.speed + bug.phase;
        bug.mesh.position.set(
          Math.cos(angle) * bug.radius,
          Math.sin(elapsed * bug.freqY + bug.phase) * bug.yAmp,
          Math.sin(angle) * bug.radius
        );
        bug.mesh.lookAt(camera.position);
      });
    });

    // 5. 二楼四个宿舍房间的船员晚间动态
    // 5.1 左一房间：年轻人打游戏（双手敲击、身体微倾、屏幕微光跳动）
    if (characterAnims.gamer) {
      const { char, screenLight } = characterAnims.gamer;
      char.leftArmPivot.rotation.x = -1.05 + Math.sin(elapsed * 14.0) * 0.08;
      char.rightArmPivot.rotation.x = -1.05 + Math.cos(elapsed * 16.0) * 0.09;
      char.rightArmPivot.rotation.z = Math.sin(elapsed * 10.0) * 0.06;
      char.headGroup.rotation.y = Math.sin(elapsed * 2.5) * 0.12;
      char.torso.rotation.x = 0.08 + Math.sin(elapsed * 3.2) * 0.03;
      screenLight.intensity = 0.85 + Math.sin(elapsed * 18.0) * 0.15;
    }

    // 5.2 左二房间：老师傅喝茶（规律举杯品茶、悠闲点头、茶壶热气袅袅上升）
    if (characterAnims.master) {
      const { char } = characterAnims.master;
      const sipWave = Math.max(0, Math.sin(elapsed * 1.1));
      const sipCurve = Math.pow(sipWave, 3); // 平缓举杯停留再放下
      char.rightArmPivot.rotation.x = -0.65 - sipCurve * 1.15;
      char.rightArmPivot.rotation.z = -sipCurve * 0.22;
      char.headGroup.rotation.x = sipCurve * -0.18 + Math.sin(elapsed * 2.2) * 0.04;
      char.headGroup.rotation.y = Math.sin(elapsed * 0.8) * 0.1;
    }
    teaSteamParticles.forEach((p) => {
      const t = (elapsed * 0.45 + p.offset) % 1.0;
      p.mesh.position.y = p.baseY + t * 0.55;
      p.mesh.position.x = 0.18 + Math.sin(elapsed * 3.0 + p.offset * 6.0) * 0.04;
      p.mesh.material.opacity = (1.0 - t) * 0.45;
      p.mesh.scale.setScalar(0.8 + t * 0.9);
    });

    // 5.3 右二房间：船员在窗边打电话（转身踱步、左手自然比划、点头交谈）
    if (characterAnims.caller) {
      const { char } = characterAnims.caller;
      char.root.position.x = 0.28 + Math.sin(elapsed * 0.95) * 0.18;
      char.root.rotation.y = -0.25 + Math.sin(elapsed * 1.2) * 0.28;
      char.leftArmPivot.rotation.x = -0.45 + Math.sin(elapsed * 3.6) * 0.35;
      char.leftArmPivot.rotation.z = 0.18 + Math.cos(elapsed * 2.8) * 0.15;
      char.headGroup.rotation.z = Math.sin(elapsed * 2.1) * 0.06;
    }

    // 5.4 右一房间：船员在台灯下读书（专注阅读、轻微翻页与思考动作）
    if (characterAnims.reader) {
      const { char } = characterAnims.reader;
      const pageTurn = Math.pow(Math.max(0, Math.sin(elapsed * 0.85)), 6);
      char.rightArmPivot.rotation.x = -1.1 - pageTurn * 0.35;
      char.rightArmPivot.rotation.y = pageTurn * 0.28;
      char.headGroup.rotation.y = Math.sin(elapsed * 1.4) * 0.08;
      char.headGroup.rotation.x = 0.28 + Math.sin(elapsed * 0.9) * 0.05;
    }

    // 6. 二楼窗户玻璃表面的雨滴蜿蜒滑落
    windowRainBeads.forEach((b) => {
      b.y -= delta * b.speed;
      if (b.y < -0.75) {
        b.y = 0.75;
      }
      b.mesh.position.y = b.y;
      b.mesh.position.x = b.baseX + Math.sin(b.y * 5.0 + b.wigglePhase) * 0.03;
    });

    // 7. 持续降雨粒子更新
    const posArr = rainGeo.attributes.position.array;
    for (let i = 0; i < rainCount; i++) {
      const speed = rainVelocities[i] * delta;
      posArr[i * 6 + 1] -= speed;
      posArr[i * 6 + 4] -= speed;
      posArr[i * 6] -= speed * 0.08;
      posArr[i * 6 + 3] -= speed * 0.08;

      if (posArr[i * 6 + 4] < -0.4) {
        const ny = 22 + Math.random() * 4;
        const nx = (Math.random() - 0.5) * 42;
        const len = posArr[i * 6 + 1] - posArr[i * 6 + 4];
        posArr[i * 6] = nx;
        posArr[i * 6 + 1] = ny;
        posArr[i * 6 + 3] = nx - 0.08;
        posArr[i * 6 + 4] = ny - len;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;

    // 8. 屋檐滴水与甲板水花扩散
    eavesDrips.forEach((d) => {
      d.progress = (d.progress + delta * d.speed) % 1.0;
      if (d.progress < 0.72) {
        // 水滴下落阶段
        const fallT = d.progress / 0.72;
        const curY = THREE.MathUtils.lerp(d.startY, d.targetY, fallT * fallT);
        d.dropMesh.position.y = curY;
        d.dropMesh.visible = true;
        d.splashRing.visible = false;
      } else {
        // 落到甲板产生水花涟漪扩散阶段
        const ringT = (d.progress - 0.72) / 0.28;
        d.dropMesh.visible = false;
        d.splashRing.visible = true;
        d.splashRing.scale.setScalar(0.6 + ringT * 2.4);
        d.splashRing.material.opacity = (1.0 - ringT) * 0.65;
      }
    });

    // 9. 船舷红旗在雨夜江风中轻轻飘动
    animatedFlags.forEach((f) => {
      const pos = f.mesh.geometry.attributes.position;
      const base = f.baseGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const bx = base.getX(i);
        const by = base.getY(i);
        const wave = Math.sin(bx * 5.0 - elapsed * 6.5 + f.phase) * (bx * 0.18);
        pos.setZ(i, wave);
        pos.setY(i, by + Math.cos(bx * 4.0 - elapsed * 5.0) * (bx * 0.04));
      }
      pos.needsUpdate = true;
    });

    renderer.render(scene, camera);
  }

  // 自适应窗口缩放
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 启动场景动画
  animate();
};
</script>
